schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/crispr-screen-s0001-l6"
version = "1.0.0"
description = "Take over a pooled CRISPR drug-modifier screen from a predecessor: recount staggered amplicon reads, establish which libraries received drug, call sensitisers and resistance genes to a stated release criterion, audit the inherited analysis and write the erratum for a mailed hit list. Level 6: same inputs and planted truth as level 4; the text no longer says what to look out for (see the task card)."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "crispr_screen", "cutadapt", "MAGeCK", "Python", "numpy/scipy/pandas"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.2 Genomics & Sequence Analysis"
family = "crispr_screen"
difficulty_tier_prior = "full-spectrum"
difficulty_explanation = "19 tool invocations in the reference solution, 4 tools, 7 undisclosed decision point(s), ~1 min oracle runtime"
seed = 1
level = 6
difficulty_prior = 0.675
pass_threshold = 0.9
oracle_steps = 19
oracle_runtime_min = 1.0
needs_gui = false
software = ["cutadapt", "MAGeCK", "Python", "numpy/scipy/pandas"]
capabilities = ["read-structure reasoning from lab notes", "per-sample QC before analysis", "auditing inherited work by recomputation", "trusting data over metadata", "self-checking calls against in-data controls", "choosing statistics that match the noise", "exact output contracts"]
traps = ["staggered_amplicon", "read2_only_sample", "hit_enriched_library", "H_inherited_project", "P_sample_sheet_arms", "P_drug_vs_t0", "Q_modifier_calls"]
derived_from = "crispr-screen-s0001-l4"
source_level = 4
scaffolding_removed = ["S2: the instruction to confirm the arm of every day-14 library from the data, and the sentence that libraries are grouped by the treatment they actually received (SOP section 3, instruction)", "S1: the release criterion on the reference genes (SOP section 5); reference_genes.tsv stays in the inputs", "S3: the eight-item hand-over audit checklist (SOP section 6) and the deliverable audit.tsv; its weight (0.20) is redistributed proportionally over the other four components", "S5: wet-lab notes without the two incident reports (the day-14 tubes re-racked before the sample sheet was filled in; the library that failed QC and came back as a Read-2 file). The sequencing run of every library is in the sample sheet", "the `arm` field of qc.json is no longer asked for (it was never scored; its description told the reader that the analysed group can differ from the sample sheet)"]
text_inputs_edited = ["handover/HANDOVER.md", "screen_design.md", "screen_sop.md"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com", "aiplatform.googleapis.com", "oauth2.googleapis.com", "api.anthropic.com", "api.openai.com", "openrouter.ai", "api.deepseek.com", "dashscope.aliyuncs.com", "api.moonshot.cn", "open.bigmodel.cn"]

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8000
storage_mb = 10000
