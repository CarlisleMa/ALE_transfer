schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/somatic-tn-s0002-l3"
version = "1.0.0"
description = "Align six panel libraries of three cancer patients, establish which normal belongs to which tumour, and deliver filtered somatic SNV/indel calls with allele fractions per patient."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "somatic_tn", "bwa", "minimap2", "samtools", "bcftools", "pysam", "Python"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.2 Genomics & Sequence Analysis"
family = "somatic_tn"
difficulty_tier_prior = "last-exam"
difficulty_explanation = "33 tool invocations in the reference solution, 6 tools, 3 undisclosed decision point(s), ~0.4 min oracle runtime"
seed = 2
level = 3
difficulty_prior = 0.702
pass_threshold = 0.9
oracle_steps = 33
oracle_runtime_min = 0.4
needs_gui = false
software = ["bwa", "minimap2", "samtools", "bcftools", "pysam", "Python"]
capabilities = ["sample identity QC before analysis", "read-level artefact diagnosis (orientation, mapping quality)", "long tool chain from raw reads to filtered calls", "tumour/normal comparison without a turnkey caller", "exact output contracts (VCF normalisation)"]
traps = ["sample_swap", "duplicated_segment", "orientation_artifacts"]
reference_source = "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr22.fa.gz"
reference_sha256 = "05f9d97d6fbfd08a44ca45b50837ca2ae9c471f35ba79dffec04d2cb5eaaf695"
fastq_bytes = 21008610

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com", "aiplatform.googleapis.com", "oauth2.googleapis.com", "api.anthropic.com", "api.openai.com", "openrouter.ai", "api.deepseek.com", "dashscope.aliyuncs.com", "api.moonshot.cn", "open.bigmodel.cn"]

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8000
storage_mb = 10000
