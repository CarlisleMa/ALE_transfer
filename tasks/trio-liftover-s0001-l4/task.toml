schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/trio-liftover-s0001-l4"
version = "1.0.0"
description = "Express a provider's joint trio call set against GRCh38 (including the positions where the two reference assemblies differ), report the alleles in unaligned sequence, and return the candidate causal variants of the proband under a lab SOP with per-copy codon consequences."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "trio_liftover", "bcftools", "bcftools +liftover", "bcftools csq", "samtools/htslib", "Picard", "Python/pysam"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.2 Genomics & Sequence Analysis"
family = "trio_liftover"
difficulty_tier_prior = "last-exam"
difficulty_explanation = "24 tool invocations in the reference solution, 6 tools, 10 undisclosed decision point(s), ~0.3 min oracle runtime"
seed = 1
level = 4
difficulty_prior = 0.701
pass_threshold = 0.9
oracle_steps = 24
oracle_runtime_min = 0.3
needs_gui = false
software = ["bcftools", "bcftools +liftover", "bcftools csq", "samtools/htslib", "Picard", "Python/pysam"]
capabilities = ["verifying the genome build of delivered data", "cross-build lift-over with reject handling", "re-expressing genotypes where two reference assemblies differ", "variant normalisation before database lookup", "trio phasing by transmission", "haplotype-aware consequence prediction", "trio inheritance reasoning under a written SOP", "exact output contracts"]
traps = ["build_mismatch", "contig_naming", "representation", "genotype_quality_decoys", "same_parent_pairs", "P_reference_differences", "P_minus_strand_block", "P_haplotype_consequence", "C_dependent_stages", "Q_gradient"]
n_input_records = 2898
