schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/hcs-dose-response-s0001-l6"
version = "1.0.0"
description = "Count the cells of a two-channel 96-well imaging plate with a procedure validated against the lab's manual counts, quantify the marker per cell, apply image QC and derive per-compound IC50/GI50 values under the SOP's definitions. Level 6: same inputs and planted truth as level 4; the text no longer says what to look out for (see the task card)."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "hcs_dose_response", "Cellpose", "scikit-image", "scipy", "tifffile", "Python"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.3 Cell & Imaging Biology"
family = "hcs_dose_response"
difficulty_tier_prior = "full-spectrum"
difficulty_explanation = "1 tool invocations in the reference solution, 5 tools, 7 undisclosed decision point(s), ~0.2 min oracle runtime"
seed = 1
level = 6
difficulty_prior = 0.564
pass_threshold = 0.9
oracle_steps = 1
oracle_runtime_min = 0.2
needs_gui = false
software = ["Cellpose", "scikit-image", "scipy", "tifffile", "Python"]
capabilities = ["validating a segmentation against manual annotation before using it", "tuning a pretrained segmentation model or building a classical alternative to a stated quality bar", "applying written counting rules (fragments, counting frame)", "plate-level QC before curve fitting", "per-well image QC", "dose-response modelling under a written potency definition", "exact output contracts"]
traps = ["Q_validated_counts", "P_potency_shape", "touching_nuclei", "focus_qc", "readout_confound", "plate_position_effects", "marker_background"]
derived_from = "hcs-dose-response-s0001-l4"
source_level = 4
scaffolding_removed = ["S5: assay notes without the four remarks that explain where the plate artefacts come from (dry humidity tray and shelf position; stain added column by column and removed at once; one fixed focus offset and no review at the microscope; unwashed wells with floating material). The artefacts are visible in the vehicle wells of the plate map and in the images. The SOP, the annotated fields and the scorer are unchanged"]
text_inputs_edited = ["assay_notes.md"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com", "aiplatform.googleapis.com", "oauth2.googleapis.com", "api.anthropic.com", "api.openai.com", "openrouter.ai", "api.deepseek.com", "dashscope.aliyuncs.com", "api.moonshot.cn", "open.bigmodel.cn"]

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8000
storage_mb = 10000
