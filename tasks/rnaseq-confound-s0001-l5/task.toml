schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/rnaseq-confound-s0001-l5"
version = "1.0.0"
description = "Take over an RNA-seq project from a predecessor: re-quantify twelve donor samples, apply the SOP's identity control, deliver gene counts, sample QC and treated-vs-vehicle differential expression, audit the inherited scripts and tables against a checklist and issue an erratum for a gene list that was already mailed. Level 5: same inputs and planted truth as level 4; without the stated acceptance criteria, verification procedures and audit checklist."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "rnaseq_confound", "salmon", "pyDESeq2", "statsmodels", "Python", "numpy/scipy/pandas"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.2 Genomics & Sequence Analysis"
family = "rnaseq_confound"
difficulty_tier_prior = "last-exam"
difficulty_explanation = "29 tool invocations in the reference solution, 5 tools, 4 undisclosed decision point(s), ~1.5 min oracle runtime"
seed = 1
level = 5
difficulty_prior = 0.707
pass_threshold = 0.9
oracle_steps = 29
oracle_runtime_min = 1.5
needs_gui = false
software = ["salmon", "pyDESeq2", "statsmodels", "Python", "numpy/scipy/pandas"]
capabilities = ["auditing inherited code and intermediate files by recomputation", "applying a stated acceptance criterion to an in-data control", "experimental-design reasoning (aliased batch)", "sample identity QC before statistics", "long tool chain from raw reads to statistics", "exact output contracts"]
traps = ["batch_confound", "sample_swap", "H_inherited_project", "Q_identity_control_mixed_library"]
derived_from = "rnaseq-confound-s0001-l4"
source_level = 4
scaffolding_removed = ["S4 + S2 + S1: the take-over SOP is not shipped: its principle about inherited files, the identity control with the marker-share formula and the 0.02 limit, and the sentence in the hand-over note that refers to it. The policy for a mixed library (reported as `mixed`, excluded) stays, as a definition of the deliverable; the marker genes stay in the gene panel", "S3: the eight-item audit checklist and the deliverable audit.tsv; its weight (0.20) is redistributed proportionally over the other seven components"]
text_inputs_edited = ["SOP_takeover.md", "previous_analysis/HANDOVER.md"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com", "aiplatform.googleapis.com", "oauth2.googleapis.com", "api.anthropic.com", "api.openai.com", "openrouter.ai", "api.deepseek.com", "dashscope.aliyuncs.com", "api.moonshot.cn", "open.bigmodel.cn"]

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8000
storage_mb = 10000
