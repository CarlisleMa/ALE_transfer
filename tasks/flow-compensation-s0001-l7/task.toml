schema_version = "1.4"
artifacts = ["/task/output"]

[task]
name = "ale-ls-gym/flow-compensation-s0001-l7"
version = "1.0.0"
description = "Derive the spillover matrix that applies to every sample of an 8-colour PBMC session whose detector settings and control reagents changed, and report the lineage and FMO-gated HLA-DR population frequencies of every sample from raw FCS 3.1 files. Level 7: same inputs and planted truth as level 7; the text no longer says what to look out for (see the task card)."
authors = [{ name = "alegen pipeline" }]
keywords = ["life-sciences", "flow_compensation", "FlowKit", "FlowIO", "fcsparser", "scikit-learn", "Python", "numpy/scipy/pandas"]

[metadata]
benchmark_alignment = "Agents' Last Exam (ALE) / life_sciences"
category = "life_sciences"
subdomain = "3.3 Cell & Imaging Biology"
family = "flow_compensation"
difficulty_tier_prior = "last-exam"
difficulty_explanation = "21 tool invocations in the reference solution, 6 tools, 9 undisclosed decision point(s), ~0.1 min oracle runtime"
seed = 1
level = 7
difficulty_prior = 0.7
pass_threshold = 0.9
oracle_steps = 21
oracle_runtime_min = 0.1
needs_gui = false
software = ["FlowKit", "FlowIO", "fcsparser", "scikit-learn", "Python", "numpy/scipy/pandas"]
capabilities = ["instrument-file metadata inspection", "compensation from single-stain controls", "reasoning about detector gain and spillover", "control selection by reagent lot", "FMO-based gating", "self-check against an in-data control", "hierarchical gating with per-sample QC", "exact output contracts", "acquisition QC along the Time parameter"]
traps = ["compensation_required", "doublets", "dead_cells", "per_sample_shift", "P_embedded_matrix", "P_voltage_change", "P_tandem_lot", "Q_fmo_gate", "T_acquisition_disturbance"]
derived_from = "flow-compensation-s0001-l7"
source_level = 7
scaffolding_removed = ["S1: the compensation acceptance criterion of the gating SOP (section 3: medians of five lymphocyte populations in the FMO tube within 50 detector units)", "S5: acquisition notes without the three incident reports (the template compensation that was never re-run; the detector voltage raised in mid-session and which controls were recorded again; the sample re-acquired with a lower FSC voltage) and without the remarks on which vials the controls were stained from. Voltages are in the FCS headers, reagent lots in controls.tsv and panel.tsv"]
text_inputs_edited = ["acquisition_notes.md", "gating_sop.md"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 7200.0
network_mode = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com", "aiplatform.googleapis.com", "oauth2.googleapis.com", "api.anthropic.com", "api.openai.com", "openrouter.ai", "api.deepseek.com", "dashscope.aliyuncs.com", "api.moonshot.cn", "open.bigmodel.cn"]

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
os = "linux"
cpus = 4
memory_mb = 8000
storage_mb = 10000
